# Порог «крупного Err» поднят осознанно.
#
# Основная форма отказа в проекте — `UseCaseResult<T> = Result<T, UseCaseFailure<T>>`
# (`src/use_cases/result.rs`), и её `Err` намеренно несёт `Option<T>`: частичный
# результат переживает отказ и доезжает до вызывающего. Поэтому `Err` здесь всегда
# примерно равен `Ok` плюс 48 байт, а сам `UseCaseError` — 40 байт: род несёт причину,
# а шаг из отказа едет по указателю (`Option<Box<NextStep>>`), чтобы не толстел каждый `Err`.
#
# Линт ищет `Err`, непропорционально раздувающий каждый `Result`; здесь непропорции
# нет, и боксирование уменьшило бы `Result` меньше чем на десятую часть, добавив
# аллокацию на каждый путь отказа. `AppError` к этим срабатываниям отношения не имеет
# вовсе: он 120 байт, то есть и так ниже штатного порога в 128.
#
# Порог оставлен конечным, а не снят: `Err` крупнее полукилобайта — уже не эта форма,
# и про него стоит узнать. Запас невелик: сегодня крупнейший — `UseCaseFailure<LaunchResult>`
# на 448 байт, то есть пара новых строковых полей в отчёте о запуске упрётся в порог и
# покраснит блокирующий гейт. Если это случится — поднимать порог, а не боксировать: форма
# та же самая.
large-error-threshold = 512

# Порог аргументов поднят с 7 до 8: ровно на единицу выше умолчания.
#
# Замер при пороге 7: 21 место, из них 15 ровно на восьми аргументах — это шум
# «на один больше», а не сигнал. Подъём до 8 снимает их и оставляет видимыми шесть
# настоящих: по три-четыре аргумента сверх умолчания. Четыре из них получили именные
# waiver'ы в этом же проходе (load_artifact.rs — 11, build_project.rs — 10 и 9,
# tests/mcp_http.rs — 9), ещё четыре waiver'а стояли до него. Waiver в tests/mcp_http.rs
# снят в #291: помощник сократился до шести аргументов.
#
# Честно про цену: те 15 мест порог waivит скопом, а не поимённо. Разбор их по одному —
# правка оркестрации, а не настройка линтера, и она сюда не входит.
too-many-arguments-threshold = 8
