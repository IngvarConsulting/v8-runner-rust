# Порог «крупного Err» поднят осознанно.
#
# Основная форма отказа в проекте — `UseCaseResult<T> = Result<T, UseCaseFailure<T>>`
# (`src/use_cases/result.rs`), и её `Err` намеренно несёт `Option<T>`: частичный
# результат переживает отказ и доезжает до вызывающего. Поэтому `Err` здесь всегда
# примерно равен `Ok` плюс 40 байт, а сам `UseCaseError` — 32 байта.
#
# Линт ищет `Err`, непропорционально раздувающий каждый `Result`; здесь непропорции
# нет, и боксирование уменьшило бы `Result` меньше чем на десятую часть, добавив
# аллокацию на каждый путь отказа. `AppError` к этим срабатываниям отношения не имеет
# вовсе: он 120 байт, то есть и так ниже штатного порога в 128.
#
# Порог оставлен конечным, а не снят: `Err` крупнее полукилобайта — уже не эта форма,
# и про него стоит узнать.
large-error-threshold = 512

# Порог аргументов поднят с 7 до 8: ровно на единицу выше умолчания, чтобы отсеять
# шум «на один аргумент больше» и оставить видимыми настоящие случаи — их четыре:
# src/use_cases/load_artifact.rs (11), src/use_cases/build_project.rs (10 и 9),
# tests/mcp_http.rs (9). Их чинят или waivят поимённо, а не порогом.
too-many-arguments-threshold = 8
