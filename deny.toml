# Проверки зависимостей разделены по назначению, а не свалены в один порог.
#
# Блокируют слияние `licenses` и `sources`: обе герметичны — считаются по Cargo.lock и
# не ходят в сеть, поэтому зелёный master не может покраснеть без правки кода. Ради
# этого они и стоят гейтом: проект под AGPL-3.0-only, и несовместимая транзитивная
# зависимость должна остановиться на въезде, а не обнаружиться при выпуске.
#
# Предупреждают `advisories` и `bans`. Первая тянет базу RustSec в момент прогона, то
# есть её вердикт меняется без изменений в репозитории: сделать её блокирующей значило
# бы останавливать все открытые PR в день публикации чужой находки. Вторая сегодня
# насчитывает 17 крейтов в нескольких версиях — это разбор, а не гейт.

[graph]
all-features = true

[licenses]
# Замер по Cargo.lock: несовместимых с AGPL-3.0-only лицензий в дереве нет, всё
# разрешительное. Список закрытый — новая лицензия обязана пройти через эту правку.
allow = [
    # Лицензия самого v8-runner: cargo-deny проверяет и корневой крейт, не только
    # зависимости, и без этой строки гейт краснел бы на первом же прогоне.
    "AGPL-3.0-only",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[advisories]
yanked = "warn"
# Датированные исключения. Каждое — решение, а не умолчание.
ignore = [
    # serde_yaml снят с сопровождения автором; разбирает v8project.yaml, то есть
    # основной контракт проекта. Замена — отдельная задача (учтено 2026-09-17).
    # Предрелизная крипта приезжает через russh и уйдёт сама с его обновлением:
    # rsa 0.10.0-rc.18, pkcs1 0.8.0-rc.4, ssh-key 0.7.0-rc.11 (учтено 2026-09-17).
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
