# Example local overlay for v8-runner
# Keep this file out of Git. The repository .gitignore excludes v8project.local.yaml.

workPath: build-local

# Infobases by name, like remotes of a repository; commands use `origin` unless
# `--infobase <name|connection string>` says otherwise.
infobases:
  origin:
    connection: "File=local/ib"
    user: Admin
    password: secret
  test:
    connection: "Srvr=srv;Ref=erp_test"
    cluster:                    # the cluster around a server infobase
      ras: srv:1545             # administration server, host[:port]
      user: cluster-admin       # cluster administrator
      password: cluster-secret

tools:
  platform:
    path: /opt/1cv8/x86_64
  va:
    epf_path: /home/user/tools/vanessa.epf

tests:
  va:
    params_path: /home/user/project/.local/va-params.json
