name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  BIN_NAME: v8-runner
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Verify release contract
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Verify tag, license, source, and package metadata
        run: python3 scripts/release/verify-release-contract.py "${RELEASE_TAG}"

      - name: Run release tests
        run: cargo test --locked

  build:
    name: Build ${{ matrix.artifact_name }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            make_task: build-release-linux-musl
            artifact_name: v8-runner-linux-x86_64-musl
            bin_suffix: ""
            archive_ext: tar.gz
            linux_deps: musl-tools
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            make_task: build-release-windows-64
            artifact_name: v8-runner-windows-x86_64
            bin_suffix: ".exe"
            archive_ext: zip
            linux_deps: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            make_task: build-release-macos-x64
            artifact_name: v8-runner-macos-x86_64
            bin_suffix: ""
            archive_ext: tar.gz
            linux_deps: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            make_task: build-release-macos-arm64
            artifact_name: v8-runner-macos-aarch64
            bin_suffix: ""
            archive_ext: tar.gz
            linux_deps: ""

    steps:
      - name: Checkout release ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux build dependencies
        if: ${{ matrix.linux_deps != '' }}
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.linux_deps }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-make
        uses: taiki-e/install-action@855644a7653423ffddd406c14064ba886514841d # cargo-make

      - name: Build release binary
        run: cargo make "${{ matrix.make_task }}"

      - name: Package portable artifact
        shell: bash
        run: |
          set -euo pipefail

          package_dir="dist/${{ matrix.artifact_name }}"
          binary_path="target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.bin_suffix }}"
          archive_name="${{ matrix.artifact_name }}.${{ matrix.archive_ext }}"

          mkdir -p "${package_dir}"
          cp "${binary_path}" "${package_dir}/"
          cp README.md "${package_dir}/"
          cp LICENSE "${package_dir}/"
          cp FORK_NOTICE.md "${package_dir}/"
          cp -R examples "${package_dir}/examples"

          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "${package_dir}/${BIN_NAME}"
          fi

          if [[ "${{ matrix.archive_ext }}" == "zip" ]]; then
            (cd dist && 7z a "${archive_name}" "${{ matrix.artifact_name }}")
          else
            (cd dist && tar -czf "${archive_name}" "${{ matrix.artifact_name }}")
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${archive_name}" > "${archive_name}.sha256")
          else
            (cd dist && shasum -a 256 "${archive_name}" > "${archive_name}.sha256")
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
            dist/${{ matrix.artifact_name }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  publish:
    name: Publish draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            Maintained fork: https://github.com/IngvarConsulting/v8-runner-rust
            Corresponding source and build scripts: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.event.inputs.tag || github.ref_name }}
            License and modification notice are included in every archive.
          files: |
            dist/*
